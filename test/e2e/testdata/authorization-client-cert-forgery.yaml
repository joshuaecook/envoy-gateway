# Regression manifest for the URI SAN comma-forgery defect.
#
# The forger client certificate carries exactly ONE URI SAN whose value contains a
# comma. Envoy's `envoy.matching.inputs.uri_san` matcher input joins every URI SAN on
# the peer certificate into one comma-separated string, so that single SAN is
# byte-identical, in the joined input, to a certificate holding the two SANs
# ".../forgery/decoy" and ".../forgery/allowed". The comma-boundary regex lowering that
# this manifest replaces therefore authorised the forger. The
# envoy.rbac.principals.mtls_authenticated lowering evaluates SANs individually, so no
# SAN on the forger certificate equals the policy value and it must be denied.
#
# Cert generation commands (for reference):
#   openssl genrsa -out ca.key 2048
#   openssl req -x509 -new -key ca.key -sha256 -days 3650 \
#     -subj "/O=Envoy Gateway Tests/CN=ClientCert Forgery Test CA" -out ca.crt
#
#   # Server cert (DNS SAN: authz-client-cert-forgery.example.com)
#   openssl genrsa -out server.key 2048
#   openssl req -new -key server.key \
#     -subj "/CN=authz-client-cert-forgery.example.com/O=Envoy Gateway Tests" -out server.csr
#   # ext: subjectAltName = DNS:authz-client-cert-forgery.example.com, extendedKeyUsage = serverAuth
#   openssl x509 -req -days 3650 -CA ca.crt -CAkey ca.key -CAcreateserial \
#     -in server.csr -out server.crt -extfile server-ext.cnf -extensions v3_req
#
#   # Allowed client cert: ONE URI SAN, no comma.
#   #   URI.1 = spiffe://envoy-gateway/tests/clientcert/forgery/allowed
#   # Forger client cert: ONE URI SAN whose value CONTAINS a comma. Written via an
#   # [alt] section (not the inline comma-separated subjectAltName form) so that
#   # openssl treats the whole string, comma included, as a single URI.
#   #   URI.1 = spiffe://envoy-gateway/tests/clientcert/forgery/decoy,spiffe://envoy-gateway/tests/clientcert/forgery/allowed
#   # Both signed with extendedKeyUsage = clientAuth.
apiVersion: v1
kind: Secret
metadata:
  name: authz-client-cert-forgery-server-cert
  namespace: gateway-conformance-infra
type: kubernetes.io/tls
data:
  tls.key: 
  tls.crt: 
  ca.crt: 
---
apiVersion: v1
kind: Secret
metadata:
  name: authz-client-cert-forgery-allowed
  namespace: gateway-conformance-infra
type: kubernetes.io/tls
data:
  tls.key: 
  tls.crt: 
  ca.crt: 
---
apiVersion: v1
kind: Secret
metadata:
  name: authz-client-cert-forgery-forger
  namespace: gateway-conformance-infra
type: kubernetes.io/tls
data:
  tls.key: 
  tls.crt: 
  ca.crt: 
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: authz-client-cert-forgery-gateway
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: "{GATEWAY_CLASS_NAME}"
  listeners:
    - name: mtls
      port: 443
      protocol: HTTPS
      hostname: authz-client-cert-forgery.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: authz-client-cert-forgery-server-cert
---
# ClientTrafficPolicy: require mTLS, validate client cert against the CA
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: authz-client-cert-forgery-ctp
  namespace: gateway-conformance-infra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: authz-client-cert-forgery-gateway
      sectionName: mtls
  tls:
    clientValidation:
      caCertificateRefs:
        - kind: Secret
          group: ""
          name: authz-client-cert-forgery-server-cert
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authz-client-cert-forgery-route
  namespace: gateway-conformance-infra
spec:
  hostnames:
    - authz-client-cert-forgery.example.com
  parentRefs:
    - name: authz-client-cert-forgery-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /allowed
      backendRefs:
        - name: infra-backend-v1
          port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authz-client-cert-forgery-allow
  namespace: gateway-conformance-infra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: authz-client-cert-forgery-route
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-spiffe-uri
        action: Allow
        principal:
          clientCert:
            subjectAltNames:
              uris:
                - type: Exact
                  value: "spiffe://envoy-gateway/tests/clientcert/forgery/allowed"
